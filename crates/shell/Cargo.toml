[package]
name = "hearth-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
input.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
system.workspace = true
stores.workspace = true
wm.workspace = true
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-skia", "renderer-software", "accessibility"] }
windows = { workspace = true, features = ["Win32_System_Power", "Win32_System_SystemInformation", "Win32_Globalization"] }

[build-dependencies]
slint-build = "1.19"
embed-resource = "3"
