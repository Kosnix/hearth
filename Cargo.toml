[workspace]
resolver = "2"
members = ["crates/input", "crates/setup", "crates/shell", "crates/stores", "crates/supervisor", "crates/system", "crates/wm"]
# Le programme d'installation embarque les binaires déjà compilés : il se construit à part (tools/make-installer.ps1).
default-members = ["crates/input", "crates/shell", "crates/stores", "crates/supervisor", "crates/system", "crates/wm"]

[workspace.dependencies]
windows = "0.62"
input = { path = "crates/input" }
system = { path = "crates/system" }
stores = { path = "crates/stores" }
wm = { path = "crates/wm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort" # le superviseur relance le shell
