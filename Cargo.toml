[workspace]
resolver = "2"
members = ["crates/input", "crates/shell", "crates/supervisor", "crates/system", "crates/wm"]

[workspace.dependencies]
windows = "0.62"
input = { path = "crates/input" }
system = { path = "crates/system" }
wm = { path = "crates/wm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort" # le superviseur relance le shell
